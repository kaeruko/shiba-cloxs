<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#fff7ec" />
  <title>しばちゃんうんちどけい</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="app">
    <header class="hero">
      <p class="eyebrow">SHIBA CLOCK</p>
      <h1>しばちゃんうんちどけい</h1>
      <p class="lead">しばちゃんの一日は、だいたいこれでできてるわん。</p>
    </header>

    <section class="clock-card" aria-label="しばちゃんの一日">
      <div class="clock-face" id="clockFace"></div>

      <div class="center-card">
        <div class="time" id="time">--:--</div>
        <div class="shiba-placeholder" id="shibaPlaceholder" aria-hidden="true">🐕</div>
        <img class="shiba-art" id="shibaArt" alt="" hidden />
        <h2 id="eventTitle">よみこみちゅうわん…</h2>
        <p id="eventText"></p>
      </div>
    </section>

    <section class="controls" aria-label="表示切り替え">
      <button id="prevButton" type="button">← まえ</button>
      <button id="nowButton" class="primary" type="button">いまのしばちゃん</button>
      <button id="nextButton" type="button">つぎ →</button>
    </section>

    <p class="hint">絵はあとから差し替えられるわん。いまは仮しばちゃんです。</p>
  </main>

  <script src="./app.js"></script>
</body>
</html>
